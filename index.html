<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0e1a">
<title>MineDrop</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0a0e1a;--panel:#111827;--grid-bg:#0d1424;--grid-line:#1e2a3a;
  --accent:#f59e0b;--green:#10b981;--blue:#3b82f6;--muted:#64748b;--text:#f1f5f9;
  --cs:42px;--gap:2px;
}
html,body{width:100%;height:100%;overflow:hidden;}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,'Helvetica Neue',sans-serif;
  display:flex;flex-direction:column;align-items:center;
  user-select:none;-webkit-user-select:none;
  touch-action:none;
  overscroll-behavior:none;
}

/* ── HEADER ── */
header{
  width:100%;max-width:520px;
  padding:6px 14px 4px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--grid-line);flex-shrink:0;
}
.logo{font-size:1.2rem;font-weight:900;letter-spacing:2px;color:var(--accent);text-shadow:0 0 20px rgba(245,158,11,.5);}
.logo span{color:var(--green);}
.score-wrap{text-align:right;position:relative;}
.score-label{font-size:.52rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.score-val{font-size:1.3rem;font-weight:900;color:var(--accent);}

/* ── META BAR ── */
.meta{
  width:100%;max-width:520px;
  padding:3px 8px;display:flex;gap:5px;align-items:center;flex-shrink:0;
}
.pill{
  background:var(--panel);border-radius:12px;padding:3px 8px;
  font-size:.62rem;font-weight:700;border:1px solid;
  display:flex;align-items:center;gap:3px;white-space:nowrap;
}
.pill-level{color:var(--blue);border-color:rgba(59,130,246,.3);}
.pill-best{color:var(--green);border-color:rgba(16,185,129,.3);}
.pill-streak{flex:1;color:var(--accent);border-color:rgba(245,158,11,.3);justify-content:center;}
.pill-x2{color:#38bdf8;border-color:rgba(56,189,248,.4);display:none;}
.pill-x2.active{display:flex;animation:x2Blink 1s ease-in-out infinite alternate;}
@keyframes x2Blink{from{box-shadow:0 0 6px rgba(56,189,248,.4);}to{box-shadow:0 0 18px rgba(56,189,248,.9);}}

/* ── GRID ── */
.grid-outer{
  flex:1;width:100%;max-width:520px;
  display:flex;align-items:center;justify-content:center;
  padding:4px;flex-shrink:0;
}
.grid-container{position:relative;}
#board{
  display:grid;
  grid-template-columns:repeat(8,var(--cs));
  grid-template-rows:repeat(8,var(--cs));
  gap:var(--gap);background:var(--grid-bg);
  border:2px solid var(--grid-line);border-radius:10px;padding:6px;
  touch-action:none;
}
.cell{
  width:var(--cs);height:var(--cs);border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  background:var(--panel);border:1.5px solid var(--grid-line);
  transition:background .07s,box-shadow .07s,transform .07s;
  overflow:hidden;
}
.cell.filled{border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 2px 6px rgba(0,0,0,.4);}
.cell canvas{display:block;pointer-events:none;}
.cell.preview-ok{background:rgba(34,197,94,.4)!important;border-color:rgba(34,197,94,1)!important;box-shadow:0 0 16px rgba(34,197,94,.8)!important;transform:scale(1.06);}
.cell.preview-bad{background:rgba(239,68,68,.25)!important;border-color:rgba(239,68,68,.8)!important;transform:scale(.96);}

@keyframes dropin{0%{transform:scale(.4) rotate(-8deg);opacity:0;}70%{transform:scale(1.1) rotate(2deg);opacity:1;}100%{transform:scale(1) rotate(0);opacity:1;}}
.cell.dropin{animation:dropin .22s cubic-bezier(.17,.67,.3,1.3) forwards;}

@keyframes shatter-tl{0%{transform:scale(1);opacity:1;}30%{transform:scale(1.2) translate(-4px,-4px) rotate(-5deg);opacity:1;}100%{transform:scale(0) translate(-30px,-26px) rotate(-45deg);opacity:0;}}
@keyframes shatter-tr{0%{transform:scale(1);opacity:1;}30%{transform:scale(1.2) translate(4px,-4px) rotate(5deg);opacity:1;}100%{transform:scale(0) translate(30px,-26px) rotate(45deg);opacity:0;}}
@keyframes shatter-bl{0%{transform:scale(1);opacity:1;}30%{transform:scale(1.2) translate(-4px,4px) rotate(4deg);opacity:1;}100%{transform:scale(0) translate(-30px,28px) rotate(40deg);opacity:0;}}
@keyframes shatter-br{0%{transform:scale(1);opacity:1;}30%{transform:scale(1.2) translate(4px,4px) rotate(-4deg);opacity:1;}100%{transform:scale(0) translate(30px,28px) rotate(-40deg);opacity:0;}}
.cell.shatter-tl{animation:shatter-tl .3s cubic-bezier(.2,0,.4,1) forwards!important;border-color:transparent!important;z-index:5;}
.cell.shatter-tr{animation:shatter-tr .3s cubic-bezier(.2,0,.4,1) forwards!important;border-color:transparent!important;z-index:5;}
.cell.shatter-bl{animation:shatter-bl .3s cubic-bezier(.2,0,.4,1) forwards!important;border-color:transparent!important;z-index:5;}
.cell.shatter-br{animation:shatter-br .3s cubic-bezier(.2,0,.4,1) forwards!important;border-color:transparent!important;z-index:5;}
@keyframes boardShake{0%,100%{transform:translate(0,0);}20%{transform:translate(-4px,2px);}40%{transform:translate(4px,-2px);}60%{transform:translate(-3px,3px);}80%{transform:translate(3px,-1px);}}
#board.shake{animation:boardShake .4s ease-in-out;}

#pcanvas{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:10;}

/* ── GHOST — floating piece that follows touch ── */
#ghost{
  position:fixed;pointer-events:none;z-index:9999;
  display:none;opacity:.92;
}
.ghost-grid{display:inline-grid;gap:var(--gap);}
.ghost-cell{border-radius:4px;overflow:hidden;}
.ghost-cell canvas{display:block;}

/* ── TRAY ── */
.tray-section{
  width:100%;max-width:520px;
  padding:4px 6px 2px;flex-shrink:0;
}
.tray{display:flex;gap:8px;justify-content:center;}
.piece-card{
  background:var(--panel);border:2px solid #374151;
  border-radius:10px;padding:8px;
  cursor:pointer;
  min-width:88px;min-height:88px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  transition:border-color .15s,box-shadow .15s,transform .15s;
  position:relative;touch-action:none;
  -webkit-touch-callout:none;user-select:none;-webkit-user-select:none;
}
.piece-card.selected{
  border-color:var(--accent);
  box-shadow:0 0 20px rgba(245,158,11,.5);
  transform:translateY(-4px) scale(1.04);
}
.piece-card.dragging{opacity:.25;transform:scale(.9);border-color:var(--accent);}
.piece-card.used{opacity:.15;pointer-events:none;}
.drag-hint{font-size:.5rem;color:var(--muted);letter-spacing:.5px;margin-top:2px;pointer-events:none;}
.piece-grid{display:inline-grid;gap:2px;}
.pc{width:20px;height:20px;border-radius:3px;overflow:hidden;}
.pc canvas{display:block;}

/* ── HINT BANNER ── */
#hint-bar{
  width:100%;max-width:520px;
  padding:3px 10px;flex-shrink:0;
  font-size:.58rem;color:var(--muted);text-align:center;
  letter-spacing:.5px;min-height:18px;
  transition:color .3s;
}
#hint-bar.ok{color:var(--green);}
#hint-bar.bad{color:#ef4444;}

/* ── BUTTONS ── */
.btn-row{
  display:flex;gap:8px;padding:4px 8px 6px;
  width:100%;max-width:520px;flex-shrink:0;
}
.btn{
  flex:1;font-weight:700;font-size:.72rem;letter-spacing:1px;
  text-transform:uppercase;border:none;border-radius:10px;
  padding:10px 0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:5px;
  transition:all .15s;-webkit-appearance:none;
}
.btn-rotate{background:#1e2a3a;color:var(--text);border:1px solid #374151;}
.btn-rotate.active{background:var(--accent);color:#000;border-color:var(--accent);}
.btn-end{background:#7f1d1d;color:#fca5a5;}
.btn-icon{width:16px;height:16px;flex-shrink:0;}

/* ── OVERLAYS ── */
.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,14,26,.92);z-index:9000;align-items:center;justify-content:center;backdrop-filter:blur(8px);}
.overlay.active{display:flex;}
.overlay-card{background:var(--panel);border:2px solid var(--accent);border-radius:16px;padding:24px;text-align:center;max-width:280px;width:88%;box-shadow:0 0 50px rgba(245,158,11,.3);}
.overlay-title{font-size:1.3rem;font-weight:900;color:var(--accent);margin-bottom:6px;letter-spacing:1px;}
.overlay-score{font-size:2rem;font-weight:900;margin:8px 0;}
.overlay-sub{font-size:.78rem;margin-bottom:14px;}
.btn-full{display:block;width:100%;font-weight:700;font-size:.82rem;letter-spacing:1px;text-transform:uppercase;border:none;border-radius:8px;padding:12px 0;cursor:pointer;margin-bottom:8px;}
.btn-revive{background:linear-gradient(135deg,var(--green),#0d9488);color:#fff;}
.btn-restart{background:var(--accent);color:#000;}

/* ── GEM CELEBRATE ── */
#gem-celebrate{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:9500;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(10,14,26,.95);cursor:pointer;}
#gem-msg{font-size:1.3rem;font-weight:900;color:var(--accent);text-align:center;letter-spacing:2px;}
#gem-tap{font-size:.7rem;color:var(--accent);letter-spacing:2px;opacity:.7;animation:tapBlink 1s ease-in-out infinite;}
@keyframes tapBlink{0%,100%{opacity:.3;}50%{opacity:1;}}
@keyframes gemBounce{0%{transform:scale(0) rotate(-20deg);opacity:0;}60%{transform:scale(1.3) rotate(5deg);opacity:1;}80%{transform:scale(.9) rotate(-3deg);}100%{transform:scale(1.1) rotate(0);opacity:1;}}
#gem-big-canvas{animation:gemBounce .6s cubic-bezier(.17,.67,.3,1.4) forwards;}

/* ── COMBO ── */
#combo-popup{position:fixed;top:35%;left:50%;font-size:1.8rem;font-weight:900;pointer-events:none;z-index:200;white-space:nowrap;display:none;transform:translate(-50%,-50%);}
#combo-popup.show{display:block;animation:comboAnim 1.2s ease-out forwards;}
@keyframes comboAnim{0%{transform:translate(-50%,-50%) scale(0) rotate(-10deg);opacity:0;}25%{transform:translate(-50%,-60%) scale(1.3) rotate(3deg);opacity:1;}70%{transform:translate(-50%,-65%) scale(1.1);opacity:1;}100%{transform:translate(-50%,-85%) scale(.8);opacity:0;}}
.score-float{position:absolute;top:-12px;right:0;font-size:.82rem;font-weight:700;color:var(--green);white-space:nowrap;animation:scoreFloat .9s ease-out forwards;pointer-events:none;}
@keyframes scoreFloat{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-32px);}}

#music-bar{position:fixed;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#f59e0b,#ef4444,#f97316,#f59e0b);background-size:300% 100%;animation:musicPulse 2s ease-in-out infinite;opacity:0;transition:opacity .8s;z-index:10;}
#music-bar.playing{opacity:.6;}
@keyframes musicPulse{0%,100%{background-position:0% 0%;}50%{background-position:300% 0%;}}

/* ── LEADERBOARD ── */
#leaderboard-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:9800;background:rgba(10,14,26,.97);align-items:center;justify-content:center;backdrop-filter:blur(10px);}
#leaderboard-overlay.active{display:flex;}
#leaderboard-card{background:var(--panel);border:2px solid var(--accent);border-radius:18px;max-width:320px;width:92%;max-height:85vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 50px rgba(245,158,11,.2);}
.lb-header{padding:16px 18px 10px;border-bottom:1px solid var(--grid-line);display:flex;align-items:center;justify-content:space-between;}
.lb-title{font-size:.9rem;font-weight:900;color:var(--accent);letter-spacing:1px;}
.lb-subtitle{font-size:.55rem;color:var(--muted);margin-top:1px;}
.lb-close{background:transparent;border:1px solid var(--grid-line);color:var(--muted);border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;}
.lb-week-info{padding:5px 18px;font-size:.55rem;color:var(--muted);text-align:center;border-bottom:1px solid var(--grid-line);}
.lb-week-info span{color:var(--accent);}
.lb-list{overflow-y:auto;flex:1;padding:6px 0;-webkit-overflow-scrolling:touch;}
.lb-row{display:flex;align-items:center;padding:8px 14px;gap:10px;border-bottom:1px solid rgba(30,42,58,.5);}
.lb-row.is-you{background:rgba(245,158,11,.08);border-left:3px solid var(--accent);}
.lb-medal{width:26px;height:26px;flex-shrink:0;}
.lb-rank-num{font-size:.7rem;font-weight:700;width:20px;text-align:center;flex-shrink:0;color:var(--muted);}
.lb-name{flex:1;font-size:.78rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lb-name.you{color:var(--accent);}
.lb-you-tag{font-size:.44rem;color:var(--accent);background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.4);border-radius:6px;padding:1px 4px;flex-shrink:0;}
.lb-score{font-size:.75rem;font-weight:700;color:var(--text);flex-shrink:0;}
.lb-score.best{color:var(--accent);}
.lb-footer{padding:10px 14px;border-top:1px solid var(--grid-line);display:flex;gap:8px;}
.lb-btn{flex:1;font-weight:700;font-size:.72rem;letter-spacing:1px;text-transform:uppercase;border:none;border-radius:8px;padding:9px 0;cursor:pointer;}
.lb-btn-play{background:var(--accent);color:#000;}
.lb-btn-close{background:var(--grid-line);color:var(--muted);}
#lb-btn-open{position:fixed;bottom:90px;right:0;background:rgba(17,24,39,.8);border:1.5px solid rgba(245,158,11,.35);border-right:none;border-radius:8px 0 0 8px;padding:8px 5px;cursor:pointer;writing-mode:vertical-rl;font-size:.42rem;font-weight:700;color:rgba(245,158,11,.7);letter-spacing:1px;text-transform:uppercase;z-index:55;}

/* ── INTRO ── */
#intro-stack{position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:#000;}
#screen-studio{position:absolute;top:0;left:0;right:0;bottom:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;animation:studioFade 2.6s ease forwards;}
@keyframes studioFade{0%{opacity:0;}15%{opacity:1;}85%{opacity:1;}100%{opacity:0;}}
#studio-name{font-size:2rem;font-weight:900;letter-spacing:4px;background:linear-gradient(135deg,#f59e0b,#fbbf24,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
#studio-name span{color:#10b981;-webkit-text-fill-color:#10b981;}
#studio-tag{font-size:.6rem;color:rgba(255,255,255,.35);letter-spacing:5px;text-transform:uppercase;margin-top:14px;}
#screen-menu{position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,#0a0e1a,#1a0a2a,#0a0e1a);display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:10vh 20px 8vh;overflow:hidden;}
#screen-menu.show{display:flex;animation:menuIn .7s ease forwards;}
@keyframes menuIn{from{opacity:0;}to{opacity:1;}}
#screen-menu.out{animation:menuOut .5s ease forwards;}
@keyframes menuOut{from{opacity:1;}to{opacity:0;}}
#menu-logo{font-size:3.8rem;font-weight:900;letter-spacing:6px;color:#f59e0b;text-shadow:0 0 40px rgba(245,158,11,.6);line-height:1;animation:logoFloat 3s ease-in-out infinite;}
#menu-logo span{color:#10b981;text-shadow:0 0 40px rgba(16,185,129,.6);}
@keyframes logoFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}
#menu-tag{font-size:.85rem;color:rgba(255,255,255,.45);letter-spacing:4px;text-transform:uppercase;margin-top:12px;}
#menu-gem-canvas{margin-top:24px;}
#btn-play{
  width:100%;max-width:280px;
  background:linear-gradient(135deg,#f59e0b,#fbbf24,#f97316);color:#000;
  font-size:1.1rem;font-weight:900;letter-spacing:5px;text-transform:uppercase;
  border:none;border-radius:50px;padding:20px 0;cursor:pointer;
  box-shadow:0 0 50px rgba(245,158,11,.6);animation:btnPulse 2s ease-in-out infinite;
  -webkit-appearance:none;
}
@keyframes btnPulse{0%,100%{box-shadow:0 0 30px rgba(245,158,11,.5);transform:scale(1);}50%{box-shadow:0 0 60px rgba(245,158,11,.9);transform:scale(1.03);}}
#menu-version{position:absolute;bottom:12px;font-size:.55rem;color:rgba(255,255,255,.18);letter-spacing:2px;}

/* ── RESPONSIVE para pantallas pequeñas ── */
@media (max-height: 700px) {
  :root{--cs:38px;}
  .piece-card{min-width:78px;min-height:78px;padding:6px;}
}
@media (min-width: 600px) {
  :root{--cs:48px;}
  .piece-card{min-width:96px;min-height:96px;}
}
@media (min-width: 768px) {
  /* iPad portrait */
  :root{--cs:52px;}
}
</style>
</head>
<body>

<!-- INTRO -->
<div id="intro-stack">
  <div id="screen-studio">
    <div id="studio-name">MOMO<span>x</span>GAMES</div>
    <div id="studio-tag">Studio</div>
  </div>
  <div id="screen-menu">
    <div style="text-align:center;z-index:2;">
      <div id="menu-logo">MINE<span>DROP</span></div>
      <div id="menu-tag">Puzzle de minerales</div>
      <canvas id="menu-gem-canvas" width="100" height="100"></canvas>
    </div>
    <div style="z-index:2;width:100%;display:flex;flex-direction:column;align-items:center;gap:16px;">
      <button id="btn-play" onclick="startGameFromMenu()">JUGAR</button>
    </div>
    <div id="menu-version">v9.2 iPad</div>
  </div>
</div>

<!-- GAME -->
<header>
  <div class="logo">MINE<span>DROP</span></div>
  <div class="score-wrap">
    <div class="score-label">Puntos</div>
    <div class="score-val" id="score-el">0</div>
  </div>
</header>

<div class="meta">
  <div class="pill pill-level"><span id="level-txt">Nv 1</span></div>
  <div class="pill pill-streak" id="streak-pill">🔥 <span id="streak-txt">0</span></div>
  <div class="pill pill-x2" id="x2-pill">⚡x2 <span id="x2-timer">30s</span></div>
  <div class="pill pill-best">🏆 <span id="best-txt">0</span></div>
</div>

<div class="grid-outer">
  <div class="grid-container">
    <canvas id="pcanvas"></canvas>
    <div id="board"></div>
  </div>
</div>

<div id="hint-bar">Toca una pieza para seleccionar, luego toca el tablero</div>

<div class="tray-section">
  <div class="tray" id="tray"></div>
</div>

<div class="btn-row">
  <button class="btn btn-rotate" id="btn-rotate" onclick="rotatePiece()">
    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    Rotar
  </button>
  <button class="btn btn-end" onclick="endGame()">
    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    Fin
  </button>
</div>

<!-- Ghost -->
<div id="ghost"><div class="ghost-grid" id="ghost-grid"></div></div>

<div id="music-bar"></div>
<div id="combo-popup"></div>

<div id="gem-celebrate">
  <canvas id="gem-big-canvas" width="140" height="140"></canvas>
  <div id="gem-msg">COMPLETO!</div>
  <div id="gem-tap">Toca para continuar</div>
</div>

<!-- GAME OVER -->
<div class="overlay" id="gameover-overlay">
  <div class="overlay-card">
    <div class="overlay-title">MINA AGOTADA</div>
    <div style="color:var(--muted);font-size:.8rem;margin-bottom:4px;">Puntuación final</div>
    <div class="overlay-score" id="final-score-el">0</div>
    <div class="overlay-sub" id="final-sub-el"></div>
    <button class="btn-full btn-restart" onclick="restart()" style="font-size:.95rem;padding:13px 0;margin-bottom:10px;">Volver a Jugar</button>
    <button class="btn-full btn-revive" id="btn-revive" onclick="doRevive()" style="margin-bottom:10px;">Continuar (+10 celdas)</button>
    <button class="btn-full" id="btn-share-go" onclick="shareScore()" style="background:linear-gradient(135deg,#25d366,#128c7e);color:#fff;margin-bottom:8px;">
      📤 Compartir Score
    </button>
    <button class="btn-full" style="background:var(--grid-line);color:var(--text);" onclick="openLeaderboard()">Ver Ranking</button>
  </div>
</div>

<!-- LEADERBOARD -->
<div id="leaderboard-overlay">
  <div id="leaderboard-card">
    <div class="lb-header">
      <div><div class="lb-title">Top Mineros</div><div class="lb-subtitle">Ranking semanal</div></div>
      <button class="lb-close" onclick="closeLeaderboard()">✕</button>
    </div>

var pcanvas=null,pctx=null,particles=[],animFrame=null;
function resizeCanvas(){
  var b=document.getElementById('board');
  if(!pcanvas)pcanvas=document.getElementById('pcanvas');
  if(!pcanvas||!b)return;
  pcanvas.width=b.offsetWidth;pcanvas.height=b.offsetHeight;
  if(!pctx)pctx=pcanvas.getContext('2d');
}
function spawnParticles(keys){
  var cs=getCS(),step=cs+getGap(),pad=6;
  keys.forEach(function(key){
    var rc=key.split(',').map(Number),r=rc[0],c=rc[1];var ore=grid[r][c];if(!ore)return;
    var cx=pad+c*step+cs/2,cy=pad+r*step+cs/2;
    for(var i=0;i<12;i++){var ang=(Math.PI*2/12)*i+Math.random()*.5,sp=2.5+Math.random()*5;particles.push({x:cx,y:cy,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-1.2,size:2+Math.random()*5,color:Math.random()<.7?ore.hi:ore.col,alpha:1,decay:.022+Math.random()*.02,gravity:.15});}
    particles.push({x:cx,y:cy,ring:true,color:ore.hi,r:2,maxR:cs*.85,alpha:1,decay:.05,lineW:2});
  });
  if(!animFrame)partLoop();

function partLoop(){
  if(!pctx)return;pctx.clearRect(0,0,pcanvas.width,pcanvas.height);
  particles=particles.filter(function(p){return p.alpha>0;});
  particles.forEach(function(p){
    pctx.save();pctx.globalAlpha=Math.max(0,p.alpha);
    if(p.ring){pctx.strokeStyle=p.color;pctx.lineWidth=p.lineW||2;pctx.beginPath();pctx.arc(p.x,p.y,p.r,0,Math.PI*2);pctx.stroke();p.r+=(p.maxR-p.r)*.15;}
    else{pctx.fillStyle=p.color;pctx.shadowColor=p.color;pctx.shadowBlur=p.size>4?8:4;pctx.beginPath();pctx.arc(p.x,p.y,p.size/2,0,Math.PI*2);pctx.fill();p.x+=p.vx;p.y+=p.vy;p.vy+=(p.gravity||.12);p.vx*=.97;p.size*=.94;}
    p.alpha-=p.decay;pctx.restore();
  });

function getCS(){return parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cs'))||42;}
function getGap(){return parseInt(getComputedStyle(document.documentElement).getPropertyValue('--gap').replace('px',''))||2;}
function rnd(items){var t=items.reduce(function(s,i){return s+i.w;},0),r=Math.random()*t;for(var i=0;i<items.length;i++){r-=items[i].w;if(r<=0)return items[i];}return items[items.length-1];}
function mkPiece(small){var s;if(small){var ss=[[[1]],[[1,1]],[[1],[1]]];s=ss[Math.floor(Math.random()*ss.length)];}else{s=SHAPES[Math.floor(Math.random()*SHAPES.length)];}return{shape:s,ore:rnd(ORES),used:false};}
function smartPieces(){
  var filled=0;for(var r=0;r<GS;r++)for(var c=0;c<GS;c++)if(grid[r][c])filled++;
  var pct=filled/(GS*GS),np=[mkPiece(),mkPiece(),mkPiece()];
  if(pct>.55){var bi=0,bs=0;np.forEach(function(p,i){var sz=p.shape.reduce(function(s,r){return s+r.filter(Boolean).length;},0);if(sz>bs){bs=sz;bi=i;}});np[bi]=mkPiece(true);}
  var any=false;for(var pi=0;pi<np.length&&!any;pi++)for(var ri=0;ri<GS&&!any;ri++)for(var ci=0;ci<GS&&!any;ci++)if(canPlace(grid,np[pi].shape,ri,ci))any=true;
  if(!any)np[0]=mkPiece(true);return np;
}
function rotateSh(sh){var rows=sh.length,cols=Math.max.apply(null,sh.map(function(r){return r.length;})),res=[];for(var c=0;c<cols;c++){var row=[];for(var r=0;r<rows;r++)row.push((sh[rows-1-r]||[])[c]||0);res.push(row);}return res;}
function canPlace(g,sh,r,c){for(var pr=0;pr<sh.length;pr++)for(var pc=0;pc<(sh[pr]||[]).length;pc++){if(!sh[pr][pc])continue;var tr=r+pr,tc=c+pc;if(tr>=GS||tc>=GS||tr<0||tc<0||g[tr][tc])return false;}return true;}
function hasMoves(g,ps){for(var pi=0;pi<ps.length;pi++){if(ps[pi].used)continue;for(var r=0;r<GS;r++)for(var c=0;c<GS;c++)if(canPlace(g,ps[pi].shape,r,c))return true;}return false;}

function shapeCenter(sh){return{r:Math.floor(sh.length/2),c:Math.floor(Math.max.apply(null,sh.map(function(r){return r.length;}))/2)};}

// Get board cell from screen coords
function cellFromPoint(clientX,clientY){
  var board=document.getElementById('board');var rect=board.getBoundingClientRect();
  var cs=getCS(),step=cs+getGap(),pad=6;
  var x=clientX-rect.left-pad,y=clientY-rect.top-pad;
  var col=Math.floor(x/step),row=Math.floor(y/step);

//  GAME STATE
// ══════════════════════════════
var grid,pieces,score,best,streak,level,reviveUsed;
var selectedIdx=-1,dragIdx=-1,dragActive=false,anchorR=0,anchorC=0;
var lastHoverR=-1,lastHoverC=-1;
var crystalFrags=0,gemIdx=0,boardThemeIdx=0;
var x2Active=false,x2Timer=null,x2Rem=0;
var totalCombos=0,flameRaf=null;
var comboTimer=null;

// ══════════════════════════════
//  DUAL INPUT: TAP-TO-PLACE + DRAG
//  
//  TAP MODE (default, reliable in iframe):
//    1. Tap piece card → selects it (selectedIdx set)
//    2. Tap board cell → places piece there
//
//  DRAG MODE (bonus, when drag starts from card):
//    1. Press & move on card → drag starts
//    2. Release on board → places piece
// ══════════════════════════════

var DRAG_THRESHOLD = 6; // px antes de activar drag
var pointerStartX=0,pointerStartY=0,pointerMoved=false;

// Offset vertical del ghost sobre el dedo — más alto = más visible
var GHOST_OFFSET_Y = 90; // px por encima del dedo

function onPiecePointerDown(idx, clientX, clientY) {
  pointerStartX = clientX;
  pointerStartY = clientY;
  pointerMoved = false;
  dragIdx = idx;
  if (pieces[idx] && !pieces[idx].used) {
    // Activar drag INMEDIATAMENTE — ghost visible desde el primer toque
    dragActive = true;
    selectedIdx = idx;
    var center = shapeCenter(pieces[idx].shape);
    anchorR = center.r; anchorC = center.c;
    lastHoverR = lastHoverC = -1;
    buildGhost(pieces[idx]);
    moveGhost(clientX, clientY);
    // Mostrar ghost encima del dedo de inmediato
    document.getElementById('ghost').style.display = 'block';
    renderPieces();
    updateHint('Desliza al tablero');
  }
}

function onPointerMove(clientX, clientY) {
  var dx = clientX - pointerStartX;
  var dy = clientY - pointerStartY;
  if (Math.sqrt(dx*dx+dy*dy) > DRAG_THRESHOLD) pointerMoved = true;

  if (dragActive && dragIdx >= 0) {
    moveGhost(clientX, clientY);
    var cell = cellFromPoint(clientX, clientY);
    if (!cell) { clearPreview(); lastHoverR=lastHoverC=-1; return; }
    var topR=cell.r-anchorR, topC=cell.c-anchorC;
    if (topR!==lastHoverR||topC!==lastHoverC) {
      lastHoverR=topR; lastHoverC=topC;
      showPreview(topR,topC,pieces[dragIdx]);
    }
  }
}

function onPointerUp(clientX, clientY) {
  if (dragActive && dragIdx >= 0) {
    hideGhost(); clearPreview();
    if (!pointerMoved) {
      // Fue un tap — seleccionar sin colocar
      dragActive = false;
      selectedIdx = (selectedIdx===dragIdx) ? -1 : dragIdx;
      dragIdx = -1;
      renderPieces(); updateRotateBtn();
      if (selectedIdx>=0) {
        sfxSelect();
        updateHint('Toca una celda del tablero para colocar');
      } else {
        updateHint('Toca una pieza para seleccionar');
      }
      return;
    }
    // Fue drag — intentar colocar
    var cell = cellFromPoint(clientX, clientY);
    if (cell) {
      var topR=cell.r-anchorR, topC=cell.c-anchorC;
      if (canPlace(grid,pieces[dragIdx].shape,topR,topC)) {
        var idx=dragIdx; dragActive=false; dragIdx=-1; selectedIdx=-1;
        placePiece(idx,topR,topC);
      } else {
        // Intentar centrado
        var center=shapeCenter(pieces[dragIdx].shape);
        var tr2=cell.r-center.r, tc2=cell.c-center.c;
        if (canPlace(grid,pieces[dragIdx].shape,tr2,tc2)) {
          var idx2=dragIdx; dragActive=false; dragIdx=-1; selectedIdx=-1;
          placePiece(idx2,tr2,tc2);
        } else {
          sfxInvalid(); updateHint('No cabe aquí — intenta otra celda','bad');
          dragActive=false; dragIdx=-1; renderPieces();
        }
      }
    } else {
      dragActive=false; dragIdx=-1; renderPieces();
      updateHint('Toca una pieza para seleccionar');
    }
  } else {
    dragActive=false; dragIdx=-1;
  }
}

// Board tap — TAP-TO-PLACE
function onBoardTap(clientX, clientY) {
  if (dragActive) return; // drag handled by onPointerUp
  if (selectedIdx < 0 || pieces[selectedIdx].used) {
    updateHint('Primero selecciona una pieza','bad');
    sfxInvalid(); return;
  }
  var cell = cellFromPoint(clientX, clientY);
  if (!cell) return;
  // Try to place with top-left = cell
  if (canPlace(grid,pieces[selectedIdx].shape,cell.r,cell.c)) {
    var idx=selectedIdx; selectedIdx=-1;
    clearPreview(); updateRotateBtn(); renderPieces();
    placePiece(idx,cell.r,cell.c);
    return;
  }
  // Try centered on cell
  var center=shapeCenter(pieces[selectedIdx].shape);
  var topR=cell.r-center.r, topC=cell.c-center.c;
  if (canPlace(grid,pieces[selectedIdx].shape,topR,topC)) {
    var idx2=selectedIdx; selectedIdx=-1;
    clearPreview(); updateRotateBtn(); renderPieces();
    placePiece(idx2,topR,topC);
    return;
  }
  sfxInvalid(); updateHint('No cabe aquí — intenta otra celda','bad');
}

// Board hover (mouse only) for preview in tap mode
function onBoardHover(clientX, clientY) {
  if (dragActive || selectedIdx<0) return;
  var cell=cellFromPoint(clientX,clientY);if(!cell){clearPreview();return;}
  var center=shapeCenter(pieces[selectedIdx].shape);
  var topR=cell.r-center.r,topC=cell.c-center.c;
  showPreview(topR,topC,pieces[selectedIdx]);
}

// Ghost
function buildGhost(piece){
  var gg=document.getElementById('ghost-grid');gg.innerHTML='';
  var cs=getCS(),gap=getGap();
  var sh=piece.shape,cols=Math.max.apply(null,sh.map(function(r){return r.length;}));
  gg.style.gridTemplateColumns='repeat('+cols+','+cs+'px)';
  gg.style.gridTemplateRows='repeat('+sh.length+','+cs+'px)';
  gg.style.gap=gap+'px';
  sh.forEach(function(row){
    for(var ci=0;ci<cols;ci++){
      var cell=document.createElement('div');cell.className='ghost-cell';
      cell.style.width=cs+'px';cell.style.height=cs+'px';
      if(row[ci]){
        cell.style.background=piece.ore.col;cell.style.boxShadow='0 0 12px '+piece.ore.hi;
        var cv=document.createElement('canvas');cv.width=cv.height=cs-4;drawMineral(cv.getContext('2d'),piece.ore,cv.width,cv.height,.88);cell.appendChild(cv);
      }else{cell.style.background='transparent';}
      gg.appendChild(cell);
    }
  });
  document.getElementById('ghost').style.display='block';
}
function moveGhost(cx,cy){
  var gh=document.getElementById('ghost');if(!gh)return;
  var cs=getCS(),gap=getGap(),idx=dragIdx;if(idx<0)return;
  var cols=Math.max.apply(null,pieces[idx].shape.map(function(r){return r.length;}));
  var rows=pieces[idx].shape.length;
  var pw=cols*(cs+gap),ph=rows*(cs+gap);
  gh.style.left=(cx-pw/2)+'px';gh.style.top=(cy-ph-18)+'px';
}
function hideGhost(){document.getElementById('ghost').style.display='none';}

function showPreview(topR,topC,piece){
  clearPreview();var sh=piece.shape;var valid=canPlace(grid,sh,topR,topC);
  for(var pr=0;pr<sh.length;pr++)for(var pc=0;pc<(sh[pr]||[]).length;pc++){
    if(!sh[pr][pc])continue;var d=cellEl(topR+pr,topC+pc);
    if(d)d.classList.add(valid?'preview-ok':'preview-bad');
  }
}
function clearPreview(){document.querySelectorAll('.cell.preview-ok,.cell.preview-bad').forEach(function(d){d.classList.remove('preview-ok','preview-bad');});}

// ── Attach events — todo desde document para evitar interrupciones en celular
(function(){
  // Board tap (click y touchend corto)
  var board=document.getElementById('board');
  board.addEventListener('click',function(e){e.preventDefault();if(!dragActive)onBoardTap(e.clientX,e.clientY);},{passive:false});
  board.addEventListener('mousemove',function(e){onBoardHover(e.clientX,e.clientY);});
  board.addEventListener('mouseleave',function(){if(!dragActive)clearPreview();});

  // GLOBAL — captura todo el movimiento/release desde document
  // Esto evita que el bloque "se pegue" al salir del tray en móvil
  document.addEventListener('mousemove',function(e){
    if(dragIdx>=0||dragActive)onPointerMove(e.clientX,e.clientY);
  },{passive:true});
  document.addEventListener('mouseup',function(e){
    if(dragIdx>=0||dragActive)onPointerUp(e.clientX,e.clientY);
  },{passive:false});

  // Touch — capture:true intercepta ANTES que cualquier hijo
  // passive:false permite preventDefault para bloquear scroll
  document.addEventListener('touchmove',function(e){
    if(dragActive && dragIdx>=0){
      e.preventDefault();
      e.stopPropagation();
      var t=e.touches[0];
      onPointerMove(t.clientX,t.clientY);
    }
  },{passive:false,capture:true});

  document.addEventListener('touchend',function(e){
    if(dragActive || dragIdx>=0){
      e.preventDefault();
      e.stopPropagation();
      var t=e.changedTouches[0];
      onPointerUp(t.clientX,t.clientY);
    }
  },{passive:false,capture:true});

  document.addEventListener('touchcancel',function(){
    dragActive=false;dragIdx=-1;hideGhost();clearPreview();
  },{passive:true,capture:true});
})();

function init(){
  grid=[];for(var r=0;r<GS;r++){var row=[];for(var c=0;c<GS;c++)row.push(null);grid.push(row);}
  pieces=smartPieces();score=0;streak=0;level=1;reviveUsed=false;
  selectedIdx=-1;dragIdx=-1;dragActive=false;lastHoverR=lastHoverC=-1;
  crystalFrags=0;gemIdx=0;boardThemeIdx=0;totalCombos=0;
  x2Active=false;clearInterval(x2Timer);x2Rem=0;
  document.getElementById('x2-pill').classList.remove('active');
  best=parseInt(localStorage.getItem('md_best')||'0');
  buildBoard();renderPieces();updateMeta();resizeCanvas();updateRotateBtn();
  updateHint('Toca una pieza para seleccionar, luego toca el tablero');
}

function buildBoard(){
  var board=document.getElementById('board');board.innerHTML='';
  for(var r=0;r<GS;r++)for(var c=0;c<GS;c++){
    var d=document.createElement('div');d.className='cell';d.dataset.r=r;d.dataset.c=c;board.appendChild(d);
  }
  renderGrid();
}

function renderGrid(){
  var cs=getCS();
  for(var r=0;r<GS;r++)for(var c=0;c<GS;c++){
    var d=cellEl(r,c);if(!d)continue;var ore=grid[r][c];
    d.innerHTML='';d.className='cell'+(ore?' filled':'');
    d.style.background=ore?ore.col:'';d.style.borderColor=ore?'transparent':'';
    if(ore){var cv=document.createElement('canvas');cv.width=cv.height=cs-4;drawMineral(cv.getContext('2d'),ore,cv.width,cv.height,1);d.appendChild(cv);}
  }
}

function updateRotateBtn(){

function renderPieces(){
  var tray=document.getElementById('tray');tray.innerHTML='';

    if(p.used){var card=document.createElement('div');card.className='piece-card used';card.style.minWidth='88px';card.style.minHeight='88px';tray.appendChild(card);return;}
    var rows=p.shape.length,cols=Math.max.apply(null,p.shape.map(function(r){return r.length;}));
    var card=document.createElement('div');
    card.className='piece-card'+(dragIdx===idx||dragActive&&dragIdx===idx?' dragging':'')+(selectedIdx===idx?' selected':'');

    var pg=document.createElement('div');pg.className='piece-grid';
    pg.style.gridTemplateColumns='repeat('+cols+',20px)';pg.style.gridTemplateRows='repeat('+rows+',20px)';

        if(row[ci]){pc.style.background=p.ore.col;var cv=document.createElement('canvas');cv.width=cv.height=20;drawMineral(cv.getContext('2d'),p.ore,20,20,1);pc.appendChild(cv);}
        pg.appendChild(pc);
      }
    });

    lbl.textContent=selectedIdx===idx?'✓ seleccionada':'toca o arrastra';card.appendChild(lbl);

    // Attach piece events — NO stopPropagation en touch para que document capture el movimiento
    (function(i){
      card.addEventListener('mousedown',function(e){e.preventDefault();e.stopPropagation();onPiecePointerDown(i,e.clientX,e.clientY);},{passive:false});
      card.addEventListener('touchstart',function(e){
        e.preventDefault();
        // NO e.stopPropagation() — dejar que document capture touchmove/touchend
        var t=e.touches[0];
        onPiecePointerDown(i,t.clientX,t.clientY);
      },{passive:false});
    }(idx));
    tray.appendChild(card);
  });
}

//  PLACE PIECE
// ══════════════════════════════
function placePiece(idx,topR,topC){
  var piece=pieces[idx];
  var isRare=piece.ore.name==='diamond'||piece.ore.name==='ruby'||piece.ore.name==='emerald';
  if(isRare)sfxRare();else sfxPlace();
  var added=[];
  for(var pr=0;pr<piece.shape.length;pr++)for(var pc2=0;pc2<(piece.shape[pr]||[]).length;pc2++){
    if(!piece.shape[pr][pc2])continue;grid[topR+pr][topC+pc2]=piece.ore;added.push((topR+pr)+','+(topC+pc2));
  }
  piece.used=true;
  var cs=getCS();
  added.forEach(function(k){
    var rc=k.split(',').map(Number),r=rc[0],c=rc[1];var d=cellEl(r,c);if(!d)return;
    d.className='cell filled dropin';d.style.background=piece.ore.col;d.style.borderColor='transparent';d.innerHTML='';
    var cv=document.createElement('canvas');cv.width=cv.height=cs-4;drawMineral(cv.getContext('2d'),piece.ore,cv.width,cv.height,1);d.appendChild(cv);
    setTimeout(function(el){return function(){el.classList.remove('dropin');};}(d),280);
  });
  var affR=new Set(),affC=new Set();added.forEach(function(k){var rc=k.split(',').map(Number);affR.add(rc[0]);affC.add(rc[1]);});
  var clearRows=Array.from(affR).filter(function(r){return grid[r].every(Boolean);});
  var clearCols=Array.from(affC).filter(function(c){return grid.every(function(row){return row[c];});});
  var total=clearRows.length+clearCols.length;
  renderPieces();updateHint(selectedIdx>=0?'Toca una celda del tablero':'Toca una pieza para seleccionar');
  if(total===0){
    streak=0;updateMeta();
    if(pieces.every(function(p){return p.used;})){pieces=smartPieces();renderPieces();}
    if(!hasMoves(grid,pieces))endGame();return;
  }
  var clearKeys=new Set();
  clearRows.forEach(function(r){for(var c=0;c<GS;c++)clearKeys.add(r+','+c);});
  clearCols.forEach(function(c){for(var r=0;r<GS;r++)clearKeys.add(r+','+c);});
  var sumR=0,sumC=0,nn=0;clearKeys.forEach(function(k){var rc=k.split(',').map(Number);sumR+=rc[0];sumC+=rc[1];nn++;});
  var cR=sumR/nn,cC=sumC/nn;
  clearKeys.forEach(function(k){
    var rc=k.split(',').map(Number),r=rc[0],c=rc[1];var d=cellEl(r,c);if(!d)return;
    var ore=grid[r][c];d.style.background=ore?ore.col:'#374151';
    var dr=r-cR,dc=c-cC;
    d.classList.add(dr<=0&&dc<=0?'shatter-tl':dr<=0&&dc>0?'shatter-tr':dr>0&&dc<=0?'shatter-bl':'shatter-br');
  });
  spawnParticles(Array.from(clearKeys));
  var board=document.getElementById('board');board.classList.add('shake');board.style.animation='boardShake .4s ease-in-out';setTimeout(function(){board.classList.remove('shake');board.style.animation='';},420);
  sfxShatter();totalCombos++;
  if(streak+1>=2)setTimeout(function(){sfxStreak(streak+1);},160);
  for(var _ci=0;_ci<total;_ci++){(function(ci){setTimeout(function(){onCrystalProg();},320+ci*200);}(_ci));}
  setTimeout(function(){
    var pts=0;clearKeys.forEach(function(k){var rc=k.split(',').map(Number),r=rc[0],c=rc[1];if(grid[r][c]){pts+=grid[r][c].pts;grid[r][c]=null;}});
    var newStreak=streak+1;var mult=total>=2?2:1,sb=Math.min(newStreak,5),x2m=x2Active?2:1;
    pts=Math.round(pts*mult*sb*x2m*(1+(level-1)*.1));
    score+=pts;streak=newStreak;
    if(score>best){best=score;localStorage.setItem('md_best',best);}
    var nL=Math.floor(score/500)+1;
    renderGrid();updateMeta();showScoreFloat((x2Active?'x2 +':'+')+pts.toLocaleString());
    if(nL>level){level=nL;sfxLevelUp();showCombo('NIVEL '+level+'!','#10b981');}
    else if(total>=3)showCombo('MEGA x'+total+'!','#f43f5e');
    else if(total>=2||newStreak>=2)showCombo(newStreak>=3?'RACHA x'+newStreak:'MULTI x'+total,'#f59e0b');
    else showCombo('COMBO!','#38bdf8');
    if(pieces.every(function(p){return p.used;}))pieces=smartPieces();
    renderPieces();if(!hasMoves(grid,pieces))endGame();
  },400);
}

function curGem(){return GEM_SEQ[gemIdx%GEM_SEQ.length];}
function onCrystalProg(){var gem=curGem();if(crystalFrags>=gem.max)return;crystalFrags++;sfxCrystal(crystalFrags);updateMeta();if(crystalFrags>=gem.max)setTimeout(activateX2,500);}
function activateX2(){
  var gem=curGem();

  document.getElementById('gem-msg').style.color=gem.color;

  function onTap(){overlay.removeEventListener('click',onTap);overlay.removeEventListener('touchend',onTap);clearTimeout(auto);doX2();}
  overlay.addEventListener('click',onTap);overlay.addEventListener('touchend',onTap);
  var auto=setTimeout(onTap,2800);
  try{var ctx=getACtx(),t=ctx.currentTime;[523,659,784,1047,1319,1568].forEach(function(f,i){playTone(f,'sine',.18,t+i*.07,.5);});}catch(e){}
  function doX2(){

function applyTheme(i){
  var t=BOARD_THEMES[i%BOARD_THEMES.length];var root=document.documentElement;

  var board=document.getElementById('board');if(board)board.style.borderColor=t.grid;

}

function rotatePiece(){var idx=selectedIdx>=0?selectedIdx:pieces.findIndex(function(p){return !p.used;});if(idx<0||pieces[idx].used)return;pieces[idx].shape=rotateSh(pieces[idx].shape);selectedIdx=idx;sfxRotate();renderPieces();clearPreview();updateRotateBtn();updateHint('Pieza rotada — toca el tablero');}
function endGame(){stopAmbient();sfxGameOver();saveWeekScore();document.getElementById('final-score-el').textContent=score.toLocaleString();var isNew=score>=best&&score>0;document.getElementById('final-sub-el').textContent=isNew?'¡Nuevo récord!':'Mejor: '+best.toLocaleString();document.getElementById('final-sub-el').style.color=isNew?'#10b981':'#64748b';document.getElementById('btn-revive').style.display=reviveUsed?'none':'block';document.getElementById('gameover-overlay').classList.add('active');}
function doRevive(){if(reviveUsed)return;reviveUsed=true;var removed=0;for(var r=0;r<GS&&removed<10;r++)for(var c=0;c<GS&&removed<10;c++)if(grid[r][c]){grid[r][c]=null;removed++;}pieces=smartPieces();selectedIdx=-1;renderGrid();renderPieces();updateMeta();updateRotateBtn();document.getElementById('gameover-overlay').classList.remove('active');if(musicOn)startAmbient();try{sfxRevive();}catch(e){}updateHint('¡Continúa minando!');}
function sfxRevive(){var c=getACtx(),t=c.currentTime;[392,494,587,740,988].forEach(function(n,i){playTone(n,'sine',.16,t+i*.09,.28);});}

  applyTheme(0);boardThemeIdx=0;
  document.getElementById('gameover-overlay').classList.remove('active');

var RIVALS=[{name:'CarbonKing',base:820,variance:340},{name:'DiamondDave',base:1450,variance:600},{name:'RockCrusher',base:620,variance:280},{name:'GoldDigger_99',base:2100,variance:800},{name:'MineRunner',base:380,variance:200},{name:'OreHunter',base:1800,variance:700},{name:'CrystalQueen',base:950,variance:400},{name:'DeepDriller',base:560,variance:250},{name:'JadeWarrior',base:1250,variance:500},{name:'RubySlayer',base:3200,variance:900}];
function getWeekNum(){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+4-(d.getDay()||7));var y=new Date(d.getFullYear(),0,1);return Math.ceil((((d-y)/86400000)+1)/7);}
function daysToMonday(){var day=new Date().getDay();return day===1?7:(8-day)%7||7;}
function seededR(seed,i){var x=Math.sin(seed*9301+i*49297+233720)*439.6453;return x-Math.floor(x);}
function buildLbData(){var week=getWeekNum();var myB=parseInt(localStorage.getItem('md_best')||'0');var myW=parseInt(localStorage.getItem('md_week_best_'+week)||'0');var entries=[];RIVALS.forEach(function(r,i){entries.push({name:r.name,score:Math.round(r.base+seededR(week,i)*r.variance),isYou:false});});entries.push({name:'Tú (Diego)',score:Math.max(myB,myW,score>0?score:0),isYou:true});entries.sort(function(a,b){return b.score-a.score;});return entries;}
function saveWeekScore(){var week=getWeekNum();var key='md_week_best_'+week;var cur=parseInt(localStorage.getItem(key)||'0');if(score>cur)localStorage.setItem(key,score);}
function drawMedal(cv,rank){if(!cv)return;var ctx=cv.getContext('2d');var W=cv.width,H=cv.height,cx=W/2,cy=H/2,r=Math.min(W,H)/2-1;var cols={1:{o:'#fbbf24',i:'#fde68a',t:'#7c4a00'},2:{o:'#94a3b8',i:'#e2e8f0',t:'#334155'},3:{o:'#cd7f32',i:'#f0b97d',t:'#7c2d12'}};var c=cols[rank];if(!c)return;var g=ctx.createRadialGradient(cx-r*.3,cy-r*.3,r*.1,cx,cy,r);g.addColorStop(0,c.i);g.addColorStop(1,c.o);ctx.fillStyle=g;ctx.shadowColor=c.o;ctx.shadowBlur=5;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle=c.t;ctx.font='bold '+(r*.95)+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(rank,cx,cy+1);}
function renderLeaderboard(){
  var entries=buildLbData();var list=document.getElementById('lb-list');list.innerHTML='';
  var wn=document.getElementById('lb-week-num');if(wn)wn.textContent=getWeekNum();
  var rd=document.getElementById('lb-reset-day');if(rd){var d=daysToMonday();rd.textContent=d===1?'mañana':'en '+d+' días';}
  entries.forEach(function(e,i){
    var rank=i+1;var row=document.createElement('div');row.className='lb-row'+(e.isYou?' is-you':'');
    if(rank<=3){var mc=document.createElement('canvas');mc.className='lb-medal';mc.width=mc.height=26;row.appendChild(mc);drawMedal(mc,rank);}
    else{var rn=document.createElement('div');rn.className='lb-rank-num';rn.textContent=rank;row.appendChild(rn);}
    var ne=document.createElement('div');ne.className='lb-name'+(e.isYou?' you':'');ne.textContent=e.name;row.appendChild(ne);
    if(e.isYou){var tag=document.createElement('div');tag.className='lb-you-tag';tag.textContent='Tú';row.appendChild(tag);}
    var se=document.createElement('div');se.className='lb-score'+(e.isYou?' best':'');se.textContent=e.score.toLocaleString();row.appendChild(se);
    list.appendChild(row);
    if(e.isYou)setTimeout(function(r){return function(){r.scrollIntoView({behavior:'smooth',block:'center'});};}(row),300);
  });
}
function openLeaderboard(){saveWeekScore();renderLeaderboard();document.getElementById('leaderboard-overlay').classList.add('active');}
function closeLeaderboard(){document.getElementById('leaderboard-overlay').classList.remove('active');}

var menuSoundOn=true,menuMusicPlaying=false,menuANodes=[];
function startMenuMusic(){
  if(menuMusicPlaying||!menuSoundOn)return;menuMusicPlaying=true;
  try{var ctx=getACtx(),t0=ctx.currentTime;var m=ctx.createGain();m.gain.setValueAtTime(0,t0);m.gain.linearRampToValueAtTime(.28,t0+1.5);m.connect(ctx.destination);menuANodes.push(m);var bTimer;function pBell(){if(!menuMusicPlaying)return;var t=ctx.currentTime+.05;var notes=[784,988,1175,1319,1568];var f=notes[Math.floor(Math.random()*notes.length)];var o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.04,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+2.2);o.connect(g);g.connect(m);o.start(t);o.stop(t+2.5);menuANodes.push(o,g);bTimer=setTimeout(pBell,1800+Math.random()*2500);}setTimeout(pBell,600);menuANodes.push({stop:function(){clearTimeout(bTimer);},disconnect:function(){}});}catch(e){}
}
function stopMenuMusic(){menuMusicPlaying=false;try{var ctx=getACtx();menuANodes.forEach(function(n){try{if(n.gain){n.gain.setValueAtTime(n.gain.value,ctx.currentTime);n.gain.linearRampToValueAtTime(0,ctx.currentTime+.5);}}catch(e){}try{n.stop(ctx.currentTime+.6);}catch(e){}try{n.disconnect();}catch(e){}});menuANodes=[];}catch(e){}}
